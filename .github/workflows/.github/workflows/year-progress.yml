
name: Update Year Progress

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-year-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Year Progress
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path

          now = datetime.now(ZoneInfo("America/Santo_Domingo"))

          year = now.year
          start = datetime(year, 1, 1, tzinfo=now.tzinfo)
          end = datetime(year + 1, 1, 1, tzinfo=now.tzinfo)

          elapsed = (now - start).total_seconds()
          total = (end - start).total_seconds()

          progress = elapsed / total * 100
          filled = round(progress / 100 * 30)
          bar = "█" * filled + "░" * (30 - filled)

          content = f"""### {year} Progress

          **{progress:.2f}%** completed

          `{bar}`

          <sub>📅 {now.strftime("%B %d, %Y")} · Automatically updated daily · America/Santo_Domingo</sub>
          """

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          start_marker = "<!--START_YEAR_PROGRESS-->"
          end_marker = "<!--END_YEAR_PROGRESS-->"

          if start_marker not in text or end_marker not in text:
              raise SystemExit("Year Progress markers not found in README.md")

          before, remainder = text.split(start_marker, 1)
          _, after = remainder.split(end_marker, 1)

          updated = (
              before
              + start_marker
              + "\n"
              + content
              + "\n"
              + end_marker
              + after
          )

          readme.write_text(updated, encoding="utf-8")
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "Update year progress"
            git push
          fi
