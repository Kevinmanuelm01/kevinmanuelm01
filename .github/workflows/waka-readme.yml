
name: Update Developer Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Developer Metrics
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          SECTION_NAME: waka
          SHOW_UPDATED_DATE: "True"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_LANGUAGE: "True"

          SHOW_OS: "False"
          SHOW_PROJECTS: "False"
          SHOW_EDITORS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_LOC_CHART: "False"
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"

          BAR_STYLE: "svg"
          BAR_COLOR: "#58A6FF"
          BAR_TRACK_COLOR: "#21262D"
          BAR_RADIUS: "4"
          TEXT_PRIMARY_COLOR: "#E6EDF3"
          TEXT_SECONDARY_COLOR: "#8B949E"
